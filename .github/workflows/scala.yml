# Ablage im Repo: .github/workflows/scala.yml
# Führt bei jedem Push und Pull Request auf main/develop die Tests aus.
# Testet automatisch auf Ubuntu und Windows.
# SonarQube und Coveralls werden nur unter Ubuntu ausgeführt.
# SonarQube wird bei Dependabot-Pull-Requests übersprungen.

name: Scala CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Java einrichten
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - name: sbt einrichten
        uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1.5.14

      - name: Tests mit Coverage
        run: sbt clean coverage test coverageReport

      - name: SonarQube Scan
        if: >-
          matrix.os == 'ubuntu-latest' &&
          github.actor != 'dependabot[bot]' &&
          (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Coveralls
        if: matrix.os == 'ubuntu-latest'
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: target/scala-3.9.0/coverage-report/cobertura.xml
          format: cobertura
          base-path: src/main/scala